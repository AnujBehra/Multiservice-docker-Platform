apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-alerts
    receivers:
      - uid: slack-alerts-receiver
        type: slack
        settings:
          url: $__env{SLACK_WEBHOOK_URL}
          title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
          text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"
        disableResolveMessage: false

  - orgId: 1
    name: email-alerts
    receivers:
      - uid: email-alerts-receiver
        type: email
        settings:
          addresses: $__env{ALERT_EMAIL_TO}
          singleEmail: false
        disableResolveMessage: false
